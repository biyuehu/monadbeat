<div class="filterOverlay" id="filterOverlay" hidden>
    <div class="filterPanel" role="dialog" aria-modal="true" aria-labelledby="filterPanelTitle">
        <div class="filterPanelHeader">
            <span class="filterPanelTitle" id="filterPanelTitle">Filter Questions</span>
            <button type="button" class="filterClose" id="filterClose" aria-label="Close">✕</button>
        </div>

        <div class="filterBody">
            <div class="filterSectionLabel">Question Type</div>
            <div class="filterOptions" id="filterOptions"></div>
        </div>

        <div class="filterFooter">
            <button type="button" class="filterAction ghost" id="filterReset">Reset</button>

        </div>
    </div>
</div>
