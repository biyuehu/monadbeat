<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monad Beat</title>
    <link rel="stylesheet" href="./styles/filter.css" />
    <link rel="stylesheet" href="./styles/headbar.css" />
    <link rel="stylesheet" href="./styles/main.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
    <div class="mainFrame">
        <div class="terminal">

            <div class="header">
                <span class="title">Question List</span>

                <div class="searchFrame">
                    <button type="button" class="filter-btn" id="filterBtn" aria-label="过滤题目" title="过滤题目">
                        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                            <path d="M3 4h18l-7 8.5V19l-4 2v-8.5L3 4z" />
                        </svg>
                    </button>

                    <div class="search-box">
                        <span class="search-icon">
                        <svg viewBox="0 0 24 24" width="20" height="20">
                            <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                        </svg>
                        </span>
                        <input type="text" class="search-input" placeholder="FINDING WHAT" />
                        <button class="search-btn">Search</button>
                    </div>
                </div>
            </div>

            <div class="listHeader">
                <span class="listLabel">📋 All Questions</span>
                <span class="listCount" id="problemCount">Loading...</span>
            </div>

            <div class="problem-grid" id="problemGrid"></div>

            <div class="footerLine">
                <span>λ Monad Beat</span>
                <span id="statusText">Haskell Practice</span>
            </div>

        </div>
    </div>

    <script src="./scripts/headbar.js"></script>
    <script src="./scripts/filter.js"></script>
    <script src="./scripts/main.js"></script>
</body>
</html>
