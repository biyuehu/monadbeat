<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MonadBeat</title>
  <script>
    (() => {
      try {
        const t = localStorage.getItem('theme');
        if (t === 'light') {
          document.documentElement.classList.add('theme-light');
        }
      } catch (_) {}
    })();
  </script>
  <style>
    :root {
      --bg-init: #050505;
      --fg-init: #d4a0ff;
      --glow-init: rgba(124, 92, 191, 0.4);
    }
    html.theme-light {
      --bg-init: #efeaf6;
      --fg-init: #6b4fa0;
      --glow-init: rgba(107, 79, 160, 0.25);
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: var(--bg-init);
      color: #d4d4d4;
    }
    #app-fallback {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background-color: var(--bg-init);
      z-index: 999999;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .fallback-logo-wrap {
      position: relative;
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .fallback-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid var(--fg-init);
      opacity: 0.35;
      animation: fallback-ping 1.6s cubic-bezier(0, 0, 0.2, 1) infinite;
    }
    .fallback-lambda {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(212, 160, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
      font-family: monospace, ui-monospace, sans-serif;
      color: var(--fg-init);
      box-shadow: 0 0 24px var(--glow-init);
      animation: fallback-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    .fallback-text {
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-family: monospace, ui-monospace, sans-serif;
      color: rgba(212, 212, 212, 0.5);
    }
    @keyframes fallback-ping {
      75%, 100% {
        transform: scale(1.75);
        opacity: 0;
      }
    }
    @keyframes fallback-pulse {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.75;
        transform: scale(0.97);
      }
    }
  </style>
</head>

<body>
  <div id="root">
    <div id="app-fallback">
      <div class="fallback-logo-wrap">
        <div class="fallback-ring"></div>
        <div class="fallback-lambda">λ</div>
      </div>
      <div class="fallback-text">MonadBeat</div>
    </div>
  </div>
  <script type="module" src="/src/index.tsx"></script>
</body>

</html>
